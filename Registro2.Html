<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>
    <link rel="stylesheet" href="Style.css">

</head>

<body>

    <form>
        <fieldset>
            <legend>Información de contacto</legend>

            <label for="name">Nombre:</label>
            <input type="text" id="name" name="nombre"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br><br>

            <label for="message">Mensaje:</label>
            <textarea id="message" name="mensaje"></textarea>
        </fieldset>

        <br>

        <fieldset>
            <legend>Intereses</legend>

            <label>
                <input type="checkbox" name="intereses" value="tecnologia">
                Tecnología
            </label><br>

            <label>
                <input type="checkbox" name="intereses" value="musica">
                Música
            </label><br>

            <label>
                <input type="checkbox" name="intereses" value="deportes">
                Deportes
            </label><br>

            <label>
                <input type="checkbox" name="intereses" value="ciencia">
                Ciencia
            </label><br>

            <label>
                <input type="checkbox" name="intereses" value="arte">
                Arte
            </label><br>
        </fieldset>

        <br>

        <input type="submit" value="Enviar">

    </form>

</body>
</html>
